<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #1f1e1e;
    }

   .calculadora {
      background: #22252d;
      padding: 24px;
      border-radius: 20px;
      width: 300px;
      border: solid #fffffe 3px;
    }

    #visor {
      width: 90%;
      height: 60px;
      background-color: #292d36;
      border-radius: 12px;
      color: #ffffff;
      font-size: 28px;
      text-align: right;
      padding: 10px 15px;
      margin-bottom: 20px;
    }

    .botoes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 55px;
      font-size: 20px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background-color: #272b33;
      color: #ffffff;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: #333742;
    }

     .btn-igual { 
      background-color: #ff7676;
      color: #ffffff;
      grid-column: span 2;
    }

    .btn-igual:hover {
      background-color: #e06666;
    } 
  </style>
</head>
<body>

  <div class="calculadora">
    <input type="text" id="visor" readonly placeholder="0">
    
    <div class="botoes">
      <button onclick="limpar()">C</button>
      <button onclick="apagar()">⌫</button>
      <button onclick="add(' / ')">÷</button>
      <button onclick="add(' * ')">×</button>

      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button onclick="add(' - ')">-</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button onclick="add(' + ')" class="btn-op">+</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button onclick="add(' . ')">.</button>

      <button onclick="add('0')">0</button>
      <button onclick="calcular()" class="btn-igual">=</button>
    </div>
  </div>

  <script>
    const visor = document.getElementById('visor');

    function add(valor) {
      visor.value += valor;
    }

    function limpar() {
      visor.value = '';
    }

    function apagar() {
      visor.value = visor.value.slice(0, -1);
    }

    function calcular() {
      try {
        if (visor.value.trim() !== '') {
          visor.value = eval(visor.value);
        }
      } catch (error) {
        visor.value = 'Erro';
        setTimeout(limpar, 1500);
      }
    }
  </script>

</body>
</html>
